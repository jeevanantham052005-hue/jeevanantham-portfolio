<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect width="400" height="260" rx="18" fill="url(#bg)" stroke="#7c3aed" stroke-width="1.5" opacity="0.8"/>
  <!-- Browser top bar -->
  <rect x="0" y="0" width="400" height="44" rx="18" fill="#1e293b"/>
  <rect x="0" y="26" width="400" height="18" fill="#1e293b"/>
  <!-- Browser dots -->
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="50" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="72" cy="22" r="6" fill="#22c55e"/>
  <!-- URL bar -->
  <rect x="100" y="12" width="220" height="20" rx="10" fill="#0f172a"/>
  <text x="210" y="26" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">jeevanantham.dev</text>
  <!-- Code lines on screen -->
  <rect x="30" y="65" width="120" height="8" rx="4" fill="#7c3aed" opacity="0.7"/>
  <rect x="30" y="82" width="90" height="6" rx="3" fill="#334155"/>
  <rect x="30" y="96" width="140" height="6" rx="3" fill="#334155"/>
  <rect x="30" y="110" width="80" height="6" rx="3" fill="#06b6d4" opacity="0.6"/>
  <rect x="30" y="124" width="110" height="6" rx="3" fill="#334155"/>
  <rect x="30" y="138" width="95" height="6" rx="3" fill="#334155"/>
  <rect x="30" y="152" width="130" height="6" rx="3" fill="#7c3aed" opacity="0.4"/>
  <rect x="30" y="166" width="70" height="6" rx="3" fill="#334155"/>
  <!-- Preview panel -->
  <rect x="200" y="58" width="175" height="140" rx="10" fill="#1e293b"/>
  <rect x="215" y="74" width="145" height="30" rx="6" fill="url(#accent)" opacity="0.8"/>
  <text x="287" y="94" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Portfolio</text>
  <rect x="215" y="112" width="100" height="8" rx="4" fill="#334155"/>
  <rect x="215" y="128" width="140" height="8" rx="4" fill="#334155"/>
  <rect x="215" y="144" width="80" height="8" rx="4" fill="#334155"/>
  <!-- Bottom label -->
  <text x="200" y="235" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Web Design &amp; Development</text>
  <text x="200" y="252" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">Responsive · Modern · Fast</text>
</svg>
